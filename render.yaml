services:
  - type: web
    plan: free
    name: TechifyBots
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    repo: https://github.com/TechifyBots/Rename-Bot.git
    branch: main
    autoDeploy: false
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: IS_FSUB
        sync: false
      - key: LOG_CHANNEL
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_URL
        sync: false
      - key: PIC
        sync: false
      - key: ADMIN
        sync: false
      - key: STRING_SESSION
        sync: false
      - key: BIN_CHANNEL
        sync: false
      - key: AUTH_CHANNELS
        sync: false
      - key: AUTH_REQ_CHANNELS
        sync: false
      - key: FSUB_EXPIRE
        sync: false
