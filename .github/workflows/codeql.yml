name: CodeQL

# Static security analysis for Python (free for public repos; private
# repos get it free too via GitHub Advanced Security on Team/Enterprise,
# otherwise the CI + pip-audit jobs above are the free fallback). Findings
# land in the repo's Security tab; the weekly run catches newly published
# queries even when no code changed.
on:
  push:
  pull_request:
  schedule:
    - cron: 0 6 * * 1

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python

      # Python needs no build step; Autobuild is a no-op for it.
      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Analyze
        uses: github/codeql-action/analyze@v4
